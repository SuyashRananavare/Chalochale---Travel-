     <nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:void(0)">ChaloChale</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mynavbar ">
        <ul class="navbar-nav ms-auto d-flex gap-3">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="destination.html">Destinations</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="packages.html">Packages</a>

            <a class="nav-link" href="booking.html">Booking</a>

          </li>

        <a href="login.html" class="btn btn-primary ms-lg-3">Login</a>
        
      </div>
    </div>
  </nav>


    <section class="pt-5 bg-light mt-5">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="text-center fw-bold mb-4">Create Account</h3>

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter full name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter email ">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter password">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Confirm password">
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Sign Up
                            </button>

                            <p class="text-center mt-3">
                                Already have an account? <a href="login.html">Sign In</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
